services:
  hugme:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: ${SECRET_KEY:?Ustaw SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      COOKIE_SECURE: ${COOKIE_SECURE:-1}
      DEMO_MODE: ${DEMO_MODE:-0}  # 1 = publiczne demo: konta bez haseł, przełącznik kont, reset po ciszy
      NTFY_URL: ${NTFY_URL:-}  # opcjonalnie: powiadomienie push o nowym odwiedzającym demo
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    volumes:
      - hugme-data:/data

volumes:
  hugme-data:
