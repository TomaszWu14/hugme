name: Monitor demo

# Co 6 godzin sprawdza publiczne demo (strona główna: 200 albo 401 z bramką portfolio — ForwardAuth
# od 24.10; /zdrowie: zawsze 200 i {"status": "ok"}). Awaria → issue
# „Demo nie odpowiada” z etykietą `demo` (jedno, kolejne awarie jako komentarze);
# powrót do normy → issue zamknięte. Wzór: container-queue `demo-monitor.yml`, uproszczony.
on:
  schedule:
    - cron: "17 */6 * * *"   # co 6 h, poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://hugme.twapp.pl
  LABEL: demo

jobs:
  check:
    name: Demo odpowiada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź demo
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          get() { curl -sS --max-time 30 --retry 3 --retry-delay 20 --retry-all-errors "$@"; }

          # Bramka odwiedzających (app/gate.py) przekierowuje / na /wejscie (302) – idziemy za przekierowaniem
          # (-L); końcowy 200 to strona bramki albo strona główna.
          # Od 24.10 demo stoi za ForwardAuth portfolio: bez ciasteczka `gosc` strony dają 401
          # z formularzem bramki (link do portfolio.twapp.pl/wejscie) — to znaczy, że bramka działa.
          # Dowodem życia aplikacji jest wtedy /zdrowie (ForwardAuth go przepuszcza), który MUSI dać status ok.
          bramka() { [ "$1" = 401 ] && grep -qF 'portfolio.twapp.pl/wejscie' page.html 2>/dev/null; }
          za_bramka=''

          rm -f page.html   # curl nie tworzy pliku przy pustej treści — bez starej strony
          code=$(get -L --max-redirs 3 -o page.html -w '%{http_code}' "$DEMO_URL/") || true
          if [ "$code" = 200 ]; then
            :
          elif bramka "$code"; then
            za_bramka=1
          else
            problems+=("Strona główna / zwraca HTTP ${code:-brak odpowiedzi} (oczekiwane 200 albo 401 z bramką portfolio)")
          fi

          health=$(get "$DEMO_URL/zdrowie") || health=''
          [ "$(jq -r '.status // empty' <<<"$health" 2>/dev/null)" = ok ] \
            || problems+=("/zdrowie nie zwraca {\"status\": \"ok\"}: ${health:0:200}")

          note=''
          [ -n "$za_bramka" ] && note=' Za bramką portfolio – sprawdzono tylko zdrowie.'

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo działa.$note" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL — problemy ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              [ -z "$note" ] || echo "-$note"
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Demo nie odpowiada" --label "$LABEL" --body-file report.md
            ntfy "Demo nie odpowiada: hugme" high warning "Demo przestało odpowiadać. Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1   # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          for n in $(gh issue list --label "$LABEL" --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów działa ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            recovered=1
          done
          if [ -n "${recovered:-}" ]; then
            ntfy "Demo znowu odpowiada: hugme" low white_check_mark "Demo znowu odpowiada. Przebieg: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
