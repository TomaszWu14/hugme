# PR z gałęzi claude/** scala się sam (squash), gdy CI jest zielone – wymóg ustawia ochrona gałęzi main.
name: Auto-merge
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

# Nowy push do PR-a anuluje starszy przebieg (main zawsze do końca — od niego zależy deploy).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: startsWith(github.head_ref, 'claude/') && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: gh pr merge --auto --squash "$PR" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
